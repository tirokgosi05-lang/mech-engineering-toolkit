<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mechanical Engineering Toolkit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Mechanical Engineering Toolkit</h1>
        <p class="subtitle">Fast calculators for core mechanics formulas.</p>
      </header>

      <section class="panel">
        <label for="operation">Calculator</label>
        <select id="operation"></select>
        <p id="equation" class="equation"></p>
      </section>

      <section class="panel">
        <form id="calc-form" novalidate>
          <div id="fields" class="grid"></div>
          <button type="submit">Calculate</button>
        </form>
      </section>

      <section class="panel result-panel">
        <h2>Result</h2>
        <p id="result" class="result">Select a calculator and enter values.</p>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
